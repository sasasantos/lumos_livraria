<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cliente — Lumos Livraria</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        @media (max-width: 768px) {
            .card {
                max-width: 100% !important;
                margin: 24px 0 !important;
            }
        }

        @media (max-width: 480px) {
            .card {
                max-width: 100% !important;
                margin: 16px 0 !important;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-inner">
            <a href="/dashboard" class="logo">
                <img src="{{ url_for('static', filename='img/logo.webp') }}" alt="Lumos">
                <div class="logo-text">Lumos <span>Livraria</span></div>
            </a>
            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/cadastro" class="active">Cadastros</a>
                <a href="/vendas">Vendas</a>
                <a href="/logout" class="nav-exit">Sair</a>
            </nav>
        </div>
    </header>

    <div class="page-header">
        <div class="container">
            <h1>Editar Cliente</h1>
            <p>Modifique os dados ou gerencie a conta do cliente cadastrado</p>
        </div>
    </div>

    <main class="container">
<div class="card animate-in" style="max-width: 650px; margin: 0 auto;">

            <div class="flex-between mb-md" style="align-items: flex-start;">
                <div>
                    <h3 class="mb-sm">Informações do Cadastro</h3>
                    <p class="text-muted text-sm">Atualize os campos necessários abaixo</p>
                </div>
                <span style="font-size:2rem;">👤</span>
            </div>

            <form action="/cliente/edit/{{ cliente.id }}" method="POST">

                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" value="{{ cliente.nome }}" placeholder="Ex: Ana Silva"
                        required>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" value="{{ cliente.email }}"
                            placeholder="exemplo@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone" value="{{ cliente.telefone }}"
                            placeholder="(11) 99999-9999">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" value="{{ cliente.cpf }}" placeholder="000.000.000-00">
                    </div>

                    <div class="form-group">
                        <label for="nascimento">Data de Nascimento</label>
                        <input type="date" id="nascimento" name="nascimento" value="{{ cliente.data_nascimento }}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="genero_favorito">Categoria de Interesse</label>
                    <select id="genero_favorito" name="genero_favorito" required>
                        <option value="">Selecione uma categoria...</option>
                        {% for cat in categorias %}
                        <option value="{{ cat.nome }}" {% if cliente.genero_favorito==cat.nome %}selected{% endif %}>
                            {{ cat.nome }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="observacoes">Observações</label>
                    <textarea id="observacoes" name="observacoes" rows="3"
                        placeholder="Restrições, preferências específicas de edições, etc."
                        style="resize:vertical;">{{ cliente.observacoes }}</textarea>
                </div>

                <div class="flex-between mt-md pt-md" style="border-top: 1px solid var(--cinza-claro); flex-wrap: wrap; gap: 12px;">

                    <a href="/cliente/delete/{{ cliente.id }}" class="btn btn-ghost"
                        style="color: #dc3545; border-color: rgba(220,53,69,0.2); background: rgba(220,53,69,0.05); flex: 1; min-width: 140px; justify-content: center;"
                        onclick="return confirm('Tem certeza que deseja remover permanentemente este cliente?')">
                        Excluir Cliente
                    </a>

                    <div style="display: flex; gap: 12px; flex-wrap: wrap; flex: 2; min-width: 240px;">
                        <a href="/cadastro" class="btn btn-ghost" style="flex: 1; min-width: 100px;">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary" style="flex: 2; min-width: 140px;">
                            Salvar Alterações
                        </button>
                    </div>

                </div>

            </form>

        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <div class="footer-brand">Lumos Livraria</div>
            <div class="footer-slogan">Histórias que iluminam</div>
            <div style="font-size:0.82rem;">&copy; 2026</div>
        </div>
    </footer>

</body>

</html>
